# Example: build a training-ready G2 dataset for new-format collection task groups.
#
# Quaternion (ee) dual-arm end-effector representation, still-frame filtering on,
# prune off (new data collection no longer records observation subtasks), and
# relative-action statistics recomputation enabled.
#
# Usage:
#   uv run lerobot-build-g2-dataset --config_path examples/g2_build_T1_quat.yaml
#
# Dry run (print the plan + subprocess commands, write nothing):
#   uv run lerobot-build-g2-dataset --config_path examples/g2_build_T1_quat.yaml --dry_run true
#
# Resume after an interrupted run (finished stage units are skipped):
#   uv run lerobot-build-g2-dataset --config_path examples/g2_build_T1_quat.yaml
#
# The final training-ready dataset lands at:
#   {output_base}/final/{final_name}

# --- I/O ---
source_dir: /data/origin_training_data/teleop/g2/mock_light_module/sourceFile  # raw G2 teleop source
output_base: /data/training_data/teleop/g2/build_mock_light_module_streaming  # structured output tree root
groups: []                                                # auto-discover T1-001-style collection task groups
final_name: g2_mock_light_module_quat_streaming           # final dataset repo_id / dir name

# --- convert stage ---
arm_mode: dual            # dual | left | right
action_type: ee           # ee (quaternion pose) | joint
video_storage: video      # video | image
vcodec: h264              # NVENC is unavailable in the current runtime
fps: 30
streaming_encoding: true  # encode continuously; avoids writing every source frame as a temporary PNG
encoder_queue_maxsize: 30
# max_episodes_per_group: 2   # uncomment for a quick smoke test

# --- still-frame filter stage (per group, parallel) ---
filter:
  enabled: true
  threshold: 1.0e-5       # L2 norm below which a frame is "unchanged" from the previous
  min_run: 1              # remove still-runs of length in [min_run, max_run]
  max_run: 3
  min_episode_frames: 2   # drop an episode if filtering leaves fewer frames
  feature_keys: ["action", "observation.state"]
  vcodec: h264
  image_writer_threads: 8

# --- prune stage: drop episodes that are entirely observation subtasks ---
# Enable only for legacy data that still records <观察> observation episodes.
prune:
  enabled: false
  pattern: "观察|<观察>"

# --- recompute_stats stage: relative-action stats (required for relative-action training) ---
stats:
  relative_action: true
  chunk_size: 50
  relative_exclude_joints: ["gripper"]
  num_workers: 24
  skip_image_video: true

# --- orchestration ---
parallel_groups: 4        # convert/filter subprocesses run this many at once (use 1 for clean tqdm bars)
force: false              # rerun finished units (removes their output first)
dry_run: false            # print plan + commands, write nothing
